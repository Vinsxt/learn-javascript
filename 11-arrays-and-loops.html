<!doctype html>

<html>
  <head>
    <title>Arrays and Loops</title>

    <style></style>
  </head>

  <body>
    <script>
      const myArray = [10, 20, 30, 40, 50];
      console.log(myArray);

      myArray.push(60);
      console.log(myArray);

      myArray.pop();
      console.log(myArray);

      myArray.splice(0, 2);
      console.log(myArray);

      let i = 1;

      while (i <= 5) {
        console.log(`i is ${i}`);
        i++;
      }

      for (let j = 1; j <= 5; j++) {
        console.log(`j is ${j}`);
      }

      const toDoList = ["Buy groceries", "Clean the house", "Finish homework"];
      for (let index = 0; index < toDoList.length; index++) {
        console.log(`Task ${index}: ${toDoList[index]}`);
      }
    </script>
  </body>
</html>
