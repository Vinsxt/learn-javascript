<!DOCTYPE html>

<html>

<head>
  <title>DOM Projects</title>

  <style>
    .css-subscribe-button {
      background-color: red;
      color: white;
      border: none;
      padding-top: 10px;
      padding-bottom: 10px;
      padding-left: 20px;
      padding-right: 20px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      border-radius: 50px;
    }
    .css-is-subscribed {
      background-color: lightgray;
      color: black;
    }

    
  </style>
</head>

<body>

  <p>Youtube Subscribe Button</p>
  <button class="subscribe-button css-subscribe-button" onclick="clickSubscribe()">Subscribe</button>

  <p>Amazon Shipping Calculator</p>
  <p>Orders under $40 = +$10 shipping.</p>
  <p>Orders over $40 = FREE shipping.</p>
  <input placeholder="Cost of order" class="order-cost" onkeydown="handleCostKeydown(event)">
  <button onclick="calculateShipping()">Calculate</button>
  <p class="shipping-result"></p>

  <script>

    function clickSubscribe() {

      let buttonElement = document.querySelector('.subscribe-button');
      if (buttonElement.innerHTML === 'Subscribe') {
        buttonElement.innerHTML = 'Subscribed';
        buttonElement.classList.add('css-is-subscribed');
      } else {
        buttonElement.innerHTML = 'Subscribe';
        buttonElement.classList.remove('css-is-subscribed');
      }
    }

    function handleCostKeydown(event) {
      if (event.key === 'Enter') {
        calculateShipping();
      }
    }

    function calculateShipping() {
      const orderInputElement = document.querySelector('.order-cost');
      let value = Number(orderInputElement.value);

      if (value < 40) {
        value = value + 10;
      }

      document.querySelector('.shipping-result').innerHTML = `$${value}`;
    }

  </script>
</body>

</html>
