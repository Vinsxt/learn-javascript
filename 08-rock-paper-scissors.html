<!DOCTYPE html>

<html>

<head>
  <title>Rock Paper Scissors</title>
</head>

<body>
  <p>Rock Paper Scissors</p>
  <button onclick="
    playGame('Rock');
    ">Rock</button>

  <button onclick="
    playGame('Paper');
    ">Paper</button>

  <button onclick="
    playGame('Scissors');
    ">Scissors</button>

  <button onclick="resetScore()">Reset score</button>

  <script>

    let score = JSON.parse(localStorage.getItem('score')) || {
      wins: 0,
      losses: 0,
      ties: 0
    };

    function resetScore() {
      score.wins = 0;
      score.losses = 0;
      score.ties = 0;
      localStorage.removeItem('score');
    }

    function playGame(playerMove) {
      const randomNumber = Math.floor(Math.random() * 3) + 1;
      let computerMove = '';

      if (randomNumber === 1) {
        computerMove = 'Rock';
      }
      else if (randomNumber === 2) {
        computerMove = 'Paper';
      }
      else {
        computerMove = 'Scissors';
      }

      console.log(`Computer move: ${computerMove}`);

      let result = '';

      if (playerMove === computerMove) {
        result = 'Tie.';
        score.ties++;
      }
      else if (
        (playerMove === 'Rock' && computerMove === 'Scissors') ||
        (playerMove === 'Paper' && computerMove === 'Rock') ||
        (playerMove === 'Scissors' && computerMove === 'Paper')
      ) {
        result = 'You win.';
        score.wins++;
      }
      else {
        result = 'You lose.';
        score.losses++;
      }

      localStorage.setItem('score', JSON.stringify(score));

      alert(`You picked ${playerMove}. Computer picked ${computerMove}. \nWins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`);
    }

  </script>
</body>

</html>
