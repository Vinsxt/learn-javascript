<!DOCTYPE html>

<html>

<head>
  <title>Rock Paper Scissors</title>
</head>

<body>
  <p>Rock Paper Scissors</p>
  <button onclick="
    playGame('Rock');
    ">Rock</button>

  <button onclick="
    playGame('Paper');
    ">Paper</button>

  <button onclick="
    playGame('Scissors');
    ">Scissors</button>

  <script>

    function playGame(playerMove) {
      const randomNumber = Math.floor(Math.random() * 3) + 1;
      let computerMove = '';
      
      if (randomNumber === 1) {
        computerMove = 'Rock';
      } 
      else if (randomNumber === 2) {
        computerMove = 'Paper';
      } 
      else {
        computerMove = 'Scissors';
      }

      console.log(`Computer move: ${computerMove}`);

      let result = '';

      if (playerMove === computerMove) {
        result = 'Tie.';
      } 
      else if (
        (playerMove === 'Rock' && computerMove === 'Scissors') ||
        (playerMove === 'Paper' && computerMove === 'Rock') ||
        (playerMove === 'Scissors' && computerMove === 'Paper')
      ) {
        result = 'You win.';
      } 
      else {
        result = 'You lose.';
      }

      alert(`You picked ${playerMove}. Computer picked ${computerMove}. \nResult: ${result}`);
    }

  </script>
</body>

</html>
