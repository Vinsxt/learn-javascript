<!doctype html>

<html>
  <head>
    <title>Advanced Functions</title>

    <style></style>
  </head>

  <body>

    <button class="js-button">Click</button>
    <script>

      // event listener
      const buttonElement = document.querySelector('.js-button');
      const eventListener = () => {
        console.log('button clicked');
      }

      buttonElement.addEventListener('click', eventListener);
      buttonElement.removeEventListener('click', eventListener);

      buttonElement.addEventListener('click', () => {
        console.log('button clicked 2');
      });

      // basic functions
      greeting();
      function greeting() {
        console.log('hello');
      }

      const function1 = function() {
        console.log('hello2');
      };

      console.log(function1);

      function1();

      function run(param) {
        param();
      }

      // function inside function
      run(function() {
        console.log('hello3');
      });

      // setTimeout function
      function testTimeOut() {
        console.log('timeout');
      }

      setTimeout(testTimeOut, 3000);

      // intervals
      let xForInterval = 5;
      let intervalId;

      function testInterval() {
        
        console.log(`interval ${xForInterval}`);
        xForInterval--;
        if (xForInterval === 0) {
          clearInterval(intervalId);
        }
      }

      intervalId = setInterval(() => {
        testInterval();
      }, 2000);

      // how to loop through an array the preferred way:
      const arr = ['capybara', 'otter', 'turtle', 'cat', 'shrimp'].forEach(function(value, index) {
        console.log(`index: ${index}, value: ${value}`);
      })

      // arrow functions
      const arrowFunction = (param, param2) => {
        console.log('this is an arrow function');
        return 5;
      }
      arrowFunction();

      const oneLineArrowFunction = param => console.log('this is a one line arrow function');
      oneLineArrowFunction();

      // shorthand function inside objects
      const functionShortcutObject = {
        method: () => {
          console.log('this is an arrow function in an object');
        },
        method2() {
          console.log('this is a shorthand method in an object');
        }
      }

      // .filter function on array:
      const array = [1, -3, 5].filter((value, index) => {
        return value >= 0;
      });

      console.log(array);

      // .map function on array:
      const array2 = [1, -3, 5].map(value => {
        return value * 2;
      });

      console.log(array2);

    </script>
  </body>
</html>
