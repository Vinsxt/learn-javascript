<!DOCTYPE html>

<html>

<head>
  <title>Rock Paper Scissors</title>

  <link rel="stylesheet" href="styles/10-rock-paper-scissors.css">
</head>

<body>
  <p class="title">Rock Paper Scissors</p>
  <button class="move-button" onclick="
    playGame('Rock');
    ">
    <img src="images/rock-emoji.png" class="move-icon">
  </button>

  <button class="move-button" onclick="
    playGame('Paper');
    ">
    <img src="images/paper-emoji.png" class="move-icon">
  </button>

  <button class="move-button" onclick="
    playGame('Scissors');
    ">
    <img src="images/scissors-emoji.png" class="move-icon">
  </button>

  <p class="result-text css-result-text"></p>
  <p class="moves-text css-moves-text"></p>
  <p class="score-text css-score-text">Wins: 0, Losses: 0, Ties: 0</p>

  <button class="css-reset-score-button" onclick="resetScore()">Reset score</button>

  <script src="scripts/10-rock-paper-scissors.js"></script>
</body>

</html>
