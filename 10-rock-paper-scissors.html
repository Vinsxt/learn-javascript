<!DOCTYPE html>

<html>

<head>
  <title>Rock Paper Scissors</title>

  <style>
    body {
      background-color: rgb(25, 25, 25);
      color: white;
      font-family: Arial;
    }
    .title {
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .move-icon {
      width: 50px;
      height: 50px;
      
    }
    .move-button {
      background-color: transparent;
      border: 3px solid white;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin-right: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <p class="title">Rock Paper Scissors</p>
  <button class="move-button" onclick="
    playGame('Rock');
    ">
    <img src="images/rock-emoji.png" class="move-icon">
  </button>

  <button class="move-button" onclick="
    playGame('Paper');
    ">
    <img src="images/paper-emoji.png" class="move-icon">
  </button>

  <button class="move-button" onclick="
    playGame('Scissors');
    ">
    <img src="images/scissors-emoji.png" class="move-icon">
  </button>

  <p class="result-text"></p>
  <p class="moves-text"></p>
  <p class="score-text">Wins: 0, Losses: 0, Ties: 0</p>

  <button onclick="resetScore()">Reset score</button>

  <script>

    let score = JSON.parse(localStorage.getItem('score')) || {
      wins: 0,
      losses: 0,
      ties: 0
    };

    function resetScore() {
      score.wins = 0;
      score.losses = 0;
      score.ties = 0;
      localStorage.removeItem('score');
      document.querySelector('.score-text').innerHTML = `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;
    }

    function displayResultDOM(result, playerMove, computerMove) {
      document.querySelector('.result-text').innerHTML = result;
      document.querySelector('.moves-text').innerHTML = `You ${playerMove} - ${computerMove} Computer`;
      document.querySelector('.score-text').innerHTML = `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;
    }

    function playGame(playerMove) {
      const randomNumber = Math.floor(Math.random() * 3) + 1;
      let computerMove = '';

      if (randomNumber === 1) {
        computerMove = 'Rock';
      }
      else if (randomNumber === 2) {
        computerMove = 'Paper';
      }
      else {
        computerMove = 'Scissors';
      }

      console.log(`Computer move: ${computerMove}`);

      let result = '';

      if (playerMove === computerMove) {
        result = 'Tie.';
        score.ties++;
        displayResultDOM(result, playerMove, computerMove);
      }
      else if (
        (playerMove === 'Rock' && computerMove === 'Scissors') ||
        (playerMove === 'Paper' && computerMove === 'Rock') ||
        (playerMove === 'Scissors' && computerMove === 'Paper')
      ) {
        result = 'You win.';
        score.wins++;
        displayResultDOM(result, playerMove, computerMove);
      }
      else {
        result = 'You lose.';
        score.losses++;
        displayResultDOM(result, playerMove, computerMove);
      }

      localStorage.setItem('score', JSON.stringify(score));
    }

  </script>
</body>

</html>
