<!DOCTYPE html>

<html>

<head>
  <title>Booleans</title>
</head>

<body>


  <script>
    const age = 22;
    
    if (age >= 18) {
        console.log("You are an adult");
    } else {
        console.log("You are a minor");
    }

    // ternary operator:
    console.log(true ? 'truthy' : 'falsy');

    // it is a shortcut for if statement like this:
    if (true) {
        console.log('truthy');
    } else {
        console.log('falsy');
    }
    
  </script>
</body>

</html>
