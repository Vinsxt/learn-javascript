<!DOCTYPE html>

<html>

<head>
  <title>Objects</title>
</head>

<body>


  <script>
    const product = {
      name: 'Socks',
      price: 1090,
      category: 'Clothing'
    };

    console.log(product);
    console.log(product.name);
    console.log(product.price);

    product.name = 'Cotton Socks';
    console.log(product);

    delete product.category;
    console.log(product);
  </script>
</body>

</html>
