<!DOCTYPE html>

<html>

<head>
  <title>Objects</title>
</head>

<body>


  <script>

    console.log(localStorage.getItem('simpleMessage'));
    
    const product = {
      name: 'Socks',
      price: 1090,
      category: 'Clothing'
    };

    console.log(product);
    // console.log(product.name);
    // console.log(product.price);

    product.name = 'Cotton Socks';
    // console.log(product);

    delete product.category;

    const product2 = {
      name: 'Shoes',
      rating: {
        count: 87,
        stars: 4.5
      },

      fun: function sayHello() {
        console.log('This is a function inside an object');
      }
    };

    product2.fun();

    console.log(product2);

    let JsonString = JSON.stringify(product2);

    let JSObject = JSON.parse(JsonString);

    localStorage.setItem('simpleMessage', 'Hello World, this is from localStorage');


  </script>
</body>

</html>
